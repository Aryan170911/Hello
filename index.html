<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Click the square</title>
  <style>
    body { font-family: sans-serif; margin: 16px; background: #fff; color: #111; }
    #field {
      position: relative;
      width: 400px;
      height: 300px;
      border: 1px solid #999;
    }
    #box {
      width: 60px;
      height: 60px;
      background: #2563eb;
      position: absolute;
      cursor: pointer;
      border: 0;
    }
  </style>
</head>
<body>
  <p>Score: <span id="score">0</span></p>
  <div id="field">
    <button id="box" type="button" aria-label="square"></button>
  </div>
  <script>
    const box = document.getElementById("box");
    const field = document.getElementById("field");
    const scoreEl = document.getElementById("score");
    let score = 0;

    function move() {
      box.style.left = Math.random() * (field.clientWidth - 60) + "px";
      box.style.top = Math.random() * (field.clientHeight - 60) + "px";
    }

    box.onclick = () => {
      score++;
      scoreEl.textContent = score;
      move();
    };

    move();
  </script>
</body>
</html>
